name: Test fail-on-error false - errors found but step succeeds
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Resolve fixture path
        id: paths
        run: |
          echo "invalid_file=$GITHUB_WORKSPACE/tests/fixtures/invalid-workflows/.github/workflows/invalid.yml" >> "$GITHUB_OUTPUT"

      - id: action
        uses: .
        with:
          files: "${{ steps.paths.outputs.invalid_file }}"
          shellcheck: "false"
          pyflakes: "false"
          fail-on-error: "false"
          cache: "false"

      - name: Assert step outcome is success (fail-on-error=false)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected step outcome 'success' but got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: step succeeded despite linting errors"

      - name: Assert exit code is non-zero (errors were found)
        env:
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
        run: |
          echo "exit-code: $EXIT_CODE"
          if [ "$EXIT_CODE" = "0" ]; then
            echo "FAIL: expected non-zero exit code but got 0"
            exit 1
          fi
          echo "PASS: exit code is $EXIT_CODE (non-zero, errors found)"
